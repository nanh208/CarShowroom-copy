spring.application.name=model-car-shop
server.port=8080

# ===== Database: H2 (mặc định, file trong ./data) =====
spring.datasource.url=jdbc:h2:file:./data/modelshop;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-secret-key-at-least-32-bytes-long!!}
app.jwt.expiration-ms=86400000

# ===== CORS / Frontend =====
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===== OAuth2 (điền client id/secret thật qua biến môi trường) =====
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth.redirect-base=${OAUTH_REDIRECT_BASE:http://localhost:8080}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB

# ===== Thanh toán: cổng sandbox (tắt bằng PAYMENT_SANDBOX=false hoặc profile prod) =====
app.payments.sandbox.enabled=${PAYMENT_SANDBOX:true}

# ===== Cổng thanh toán thật (VNPay 2.1.0 / MoMo v2). Để trống khoá VNPay → dùng cổng giả lập nội bộ. =====
# URL công khai mà VNPay/MoMo gọi IPN + trả khách về (cần HTTPS công khai: ngrok/cloudflared trỏ vào cổng frontend (proxy /api) hoặc reverse proxy chung).
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:4173}
app.payments.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payments.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payments.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payments.vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
# MoMo: mặc định là bộ khoá TEST công khai của MoMo (github.com/momo-wallet/payment) — chỉ dùng với test-payment.momo.vn.
app.payments.momo.enabled=${MOMO_ENABLED:true}
app.payments.momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
app.payments.momo.access-key=${MOMO_ACCESS_KEY:F8BBA842ECF85}
app.payments.momo.secret-key=${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
app.payments.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn}
app.payments.expire-minutes=15
