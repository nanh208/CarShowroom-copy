# Mẫu nginx cho bản build (frontend/dist) + Spring Boot (:8080). Không triển khai tự động — chỉ tham khảo.
server {
  listen 80;
  server_name arestoys.example;
  root /var/www/ares/dist;

  # Nén sẵn bởi scripts/compress.mjs (.gz/.br). brotli_static cần module ngx_brotli.
  gzip_static on;
  # brotli_static on;
  gzip on; gzip_types application/json application/xml text/css application/javascript image/svg+xml; gzip_min_length 1024;

  # Asset có hash trong tên → cache 1 năm, không bao giờ revalidate
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ~* ^/(images|models|icons)/ { add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400"; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  # API, ảnh tải lên, sitemap/robots do Spring Boot phục vụ (Spring tự đặt Cache-Control/ETag/gzip)
  location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }
  location /uploads/ { proxy_pass http://127.0.0.1:8080; }
  location /ws { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location = /sitemap.xml { proxy_pass http://127.0.0.1:8080; }
  location = /robots.txt { proxy_pass http://127.0.0.1:8080; }

  # Bot mạng xã hội / tìm kiếm không chạy JS → bản HTML có sẵn meta/OG/JSON-LD
  set $prerender 0;
  if ($http_user_agent ~* "facebookexternalhit|Twitterbot|Zalo|LinkedInBot|Slackbot|bingbot|Googlebot") { set $prerender 1; }
  location / {
    add_header Cache-Control "no-cache";
    if ($prerender = 1) { rewrite ^(.*)$ /api/public/seo/render?path=$1 break; proxy_pass http://127.0.0.1:8080; }
    try_files $uri /index.html;
  }
}
